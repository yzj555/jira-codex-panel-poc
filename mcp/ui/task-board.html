<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jira 任务工作台</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f6f7; --panel: #fff; --card: #fff; --line: #e1e5e9; --line-strong: #cbd2d9;
      --soft: #f0f2f4; --hover: #f4f6f8; --text: #1f2328; --muted: #818a95; --accent: #356bc6;
      --req: #356bc6; --bug: #bc4b40; --ok: #2f865b; --warn: #b7791f;
      --shadow: 0 10px 30px rgb(16 24 40 / 12%);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181a1d; --panel: #202328; --card: #24282d; --line: #32373e; --line-strong: #48505a;
        --soft: #2a2f35; --hover: #2d3238; --text: #f2f3f5; --muted: #9099a4; --accent: #79aaff;
        --req: #79aaff; --bug: #ff8c82; --ok: #62cf91; --warn: #f1b35d; --shadow: 0 14px 38px rgb(0 0 0 / 34%);
      }
    }
    :root[data-theme="dark"] {
      --bg: #181a1d; --panel: #202328; --card: #24282d; --line: #32373e; --line-strong: #48505a;
      --soft: #2a2f35; --hover: #2d3238; --text: #f2f3f5; --muted: #9099a4; --accent: #79aaff;
      --req: #79aaff; --bug: #ff8c82; --ok: #62cf91; --warn: #f1b35d; --shadow: 0 14px 38px rgb(0 0 0 / 34%);
    }
    :root[data-theme="light"] {
      --bg: #f5f6f7; --panel: #fff; --card: #fff; --line: #e1e5e9; --line-strong: #cbd2d9;
      --soft: #f0f2f4; --hover: #f4f6f8; --text: #1f2328; --muted: #818a95; --accent: #356bc6;
      --req: #356bc6; --bug: #bc4b40; --ok: #2f865b; --warn: #b7791f;
      --shadow: 0 10px 30px rgb(16 24 40 / 12%);
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; background: var(--bg); color: var(--text); font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    button, select, input { color: inherit; font: inherit; }
    button { min-height: 34px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 6px; outline: 0; background: var(--panel); cursor: pointer; font-weight: 620; transition: color .11s ease, border-color .11s ease, background-color .11s ease, opacity .11s ease; }
    button:hover { border-color: color-mix(in srgb, var(--accent) 48%, var(--line-strong)); background: var(--hover); color: var(--accent); }
    button:active:not(:disabled) { background: var(--soft); }
    button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
    button:disabled { opacity: .52; cursor: not-allowed; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 17px; }
    .app-title-row { display: flex; align-items: center; gap: 8px; }
    #version-status { min-height: 22px; padding: 1px 7px; border-color: var(--line); border-radius: 999px; background: var(--soft); color: var(--muted); font-size: 10px; font-weight: 680; }
    #version-status:not(.update-available) { cursor: default; }
    #version-status.update-available { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); color: var(--warn); cursor: pointer; }
    #version-status.action-required { border-color: color-mix(in srgb, var(--accent) 52%, var(--line)); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); color: var(--accent); cursor: pointer; }
    h2 { font-size: 15px; }
    #meta { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .toolbar { display: flex; align-items: center; gap: 8px; }
    #local-close { width: 34px; padding: 0; font-size: 20px; line-height: 1; }
    .monitor { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
    .monitor button[aria-pressed="true"] { border-color: var(--ok); color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--panel)); }
    nav { display: flex; gap: 18px; margin-bottom: 12px; padding: 0; border-bottom: 1px solid var(--line); background: transparent; }
    nav button { position: relative; flex: 1; border: 0; border-radius: 0; background: transparent; }
    nav button::after { position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; border-radius: 2px; background: transparent; content: ""; }
    nav button.active { background: transparent; color: var(--text); box-shadow: none; font-weight: 680; }
    nav button.active::after { background: var(--accent); }
    #error { display: none; margin-bottom: 10px; padding: 9px 10px; border-radius: 8px; background: color-mix(in srgb, var(--bug) 16%, transparent); color: var(--bug); }
    #loading { display: none; position: fixed; inset: 0; z-index: 30; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(2px); }
    #loading.visible { display: flex; }
    .loader { display: flex; align-items: center; gap: 9px; padding: 12px 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); }
    .spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    section, .sheet-panel, .detail { min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 650; }
    .section-title .count { min-width: 25px; padding: 1px 7px; border-radius: 5px; color: var(--muted); background: var(--soft); text-align: center; font-size: 11px; }
    .status-filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 9px; }
    .status-filter { min-height: 27px; padding: 0 8px; border-radius: 5px; color: var(--muted); font-size: 11px; }
    .status-filter.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); color: var(--accent); }
    .requirement .section-title strong { color: var(--req); }
    .bug .section-title strong { color: var(--bug); }
    .list { display: grid; gap: 0; }
    article { min-width: 0; padding: 10px 9px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; box-shadow: none; cursor: pointer; transition: background-color .11s ease, box-shadow .11s ease; }
    article:last-child { border-bottom: 0; }
    article:hover { border-color: var(--line); background: var(--hover); box-shadow: inset 3px 0 0 color-mix(in srgb, var(--accent) 58%, transparent); }
    .bug article:hover { box-shadow: inset 3px 0 0 color-mix(in srgb, var(--bug) 62%, transparent); }
    .task-head, .task-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .key { color: var(--accent); font-weight: 700; }
    .title { margin: 5px 0; overflow-wrap: anywhere; font-weight: 600; }
    .pill { display: inline-flex; align-items: center; max-width: 140px; padding: 1px 6px; border-radius: 4px; background: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bound { color: var(--ok); }
    .empty { padding: 24px 8px; color: var(--muted); text-align: center; }
    .sheets-layout { display: grid; grid-template-columns: minmax(190px, 34%) minmax(0, 1fr); gap: 10px; }
    .sheet-list { display: grid; gap: 6px; max-height: 500px; overflow: auto; }
    .sheet-item { width: 100%; min-height: 48px; text-align: left; }
    .sheet-item.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--panel)); }
    .sheet-item small { display: block; color: var(--muted); }
    .sheet-toolbar { display: flex; gap: 8px; margin-bottom: 8px; }
    .sheet-toolbar input, .sheet-toolbar select { min-height: 34px; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 0 9px; }
    .sheet-toolbar input { flex: 1; }
    .detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .back { min-width: 36px; padding: 0 9px; }
    .detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(180px, 30%); gap: 10px; }
    .description { white-space: pre-wrap; overflow-wrap: anywhere; padding: 10px; border-radius: 8px; background: var(--bg); }
    .parent-context { margin-top: 12px; padding: 11px; border: 1px solid color-mix(in srgb, var(--accent) 24%, var(--line)); border-radius: 9px; background: color-mix(in srgb, var(--accent) 5%, var(--panel)); }
    .parent-context-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .parent-context-head span { color: var(--muted); font-size: 11px; }
    .parent-context-head a { color: var(--accent); text-decoration: none; }
    .parent-context h3 { margin: 0 0 7px; font-size: 14px; }
    .parent-context .description { background: color-mix(in srgb, var(--bg) 72%, transparent); }
    .scope-note { margin-top: 9px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .facts { display: grid; gap: 6px; }
    .fact { display: grid; grid-template-columns: 65px minmax(0,1fr); gap: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
    .fact span:first-child { color: var(--muted); }
    .subsection { margin-top: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
    .attachments { display: grid; gap: 6px; margin-top: 6px; }
    .attachment { padding: 8px; border: 1px solid var(--line); border-radius: 8px; overflow-wrap: anywhere; }
    .attachment small { display: block; color: var(--muted); }
    .attachment button { width: 100%; min-height: 0; padding: 0; border: 0; background: transparent; text-align: left; }
    .attachment-preview { margin-top: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
    .attachment-preview-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .attachment-preview-nav { display: inline-flex; align-items: center; gap: 5px; }
    .attachment-preview-nav button { width: 30px; min-height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--text); text-align: center; }
    .attachment-preview-nav button:disabled { opacity: .35; cursor: default; }
    .attachment-preview-nav small { color: var(--muted); white-space: nowrap; }
    .attachment-preview img { display: block; max-width: 100%; max-height: 440px; margin: 6px auto 0; border-radius: 7px; object-fit: contain; }
    .transition-box { margin-top: 8px; padding: 9px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
    .transition-box select { width: 100%; min-height: 34px; margin: 7px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 0 8px; }
    .transition-box button { width: 100%; background: var(--panel); }
    .transition-hint { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .binding-box { margin-top: 8px; padding: 9px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); }
    .binding-box select { width: 100%; min-height: 34px; margin: 7px 0; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 0 8px; }
    .binding-actions { display: flex; gap: 6px; margin-top: 7px; }
    .binding-actions button { flex: 1; min-width: 0; }
    #open-bound-thread, #create-analysis { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: color-mix(in srgb, var(--accent) 8%, var(--panel)); color: var(--accent); }
    #open-bound-thread:hover, #create-analysis:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, var(--panel)); }
    #confirm-binding, #confirm-create-analysis, #execute-transition { border-color: var(--accent); background: var(--accent); color: #fff; }
    #confirm-binding:hover, #confirm-create-analysis:hover, #execute-transition:hover { border-color: color-mix(in srgb, var(--accent) 78%, #000); background: color-mix(in srgb, var(--accent) 88%, #000); color: #fff; }
    .binding-actions .danger { border-color: color-mix(in srgb, var(--bug) 45%, var(--line)); color: var(--bug); }
    .binding-current { margin-top: 5px; overflow-wrap: anywhere; font-weight: 600; }
    .binding-hint { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .svn { min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .svn-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(210px, 34%); gap: 10px; }
    .svn-card { min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
    .svn-files { display: grid; align-content: start; gap: 1px; max-height: 340px; overflow: auto; margin-top: 8px; padding: 2px; }
    .svn-tree-dir > summary { min-height: 25px; padding: 4px 3px; overflow: hidden; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .svn-tree-dir > summary:hover { color: var(--text); }
    .svn-tree-children { display: grid; gap: 1px; margin-left: 8px; padding-left: 7px; border-left: 1px solid color-mix(in srgb, var(--line) 78%, transparent); }
    .svn-file { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 6px; min-height: 38px; padding: 4px 5px; border: 1px solid transparent; border-radius: 6px; background: transparent; cursor: pointer; }
    .svn-file:hover { border-color: color-mix(in srgb, var(--line) 72%, transparent); background: color-mix(in srgb, var(--card) 72%, transparent); }
    .svn-file:has(input:checked) { border-color: color-mix(in srgb, var(--accent) 24%, transparent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
    .svn-file.preview-active, .svn-selected-row.preview-active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); box-shadow: inset 3px 0 0 var(--accent); }
    .svn-file > input { margin: 0; }
    .svn-file-copy { display: grid; min-width: 0; gap: 1px; }
    .svn-file-name, .svn-file-reason { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .svn-file-name { font-size: 11px; font-weight: 600; }
    .svn-file-reason { color: var(--muted); font-size: 9px; }
    .svn-file .svn-change-tag { flex: 0 0 auto; margin: 0; white-space: nowrap; }
    .svn-controls { display: grid; gap: 7px; margin-top: 10px; }
    .svn-controls textarea, .svn-controls input[type="text"] { width: 100%; min-height: 36px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: inherit; font: inherit; resize: vertical; }
    .svn-controls label { display: flex; align-items: flex-start; gap: 7px; }
    .svn-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 9px; }
    .svn-actions .primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .svn .primary { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 650; }
    .svn .primary:hover { border-color: color-mix(in srgb, var(--accent) 78%, #000); color: #fff; }
    .svn-actions .danger { border-color: color-mix(in srgb, var(--bug) 45%, var(--line)); color: var(--bug); }
    .svn-status { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
    .svn-check { margin-top: 6px; padding: 7px; border-radius: 7px; background: var(--panel); }
    .svn-check.warning { color: var(--warn); }
    .svn-check.block { color: var(--bug); }
    .svn-message, .svn-diff { margin: 8px 0 0; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: #15171b; color: #d8dce3; white-space: pre-wrap; overflow: auto; overflow-wrap: anywhere; font: 11px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .svn-message { background: var(--panel); color: var(--text); }
    .svn-field { display: grid; gap: 5px; color: var(--muted); font-size: 11px; }
    .svn-field > span { color: var(--text); font-weight: 650; }
    .svn-diff { max-height: 360px; }
    .diff-add { color: #72d6a6; background: rgb(45 157 111 / 12%); }
    .diff-del { color: #ff9589; background: rgb(223 103 90 / 12%); }
    .diff-hunk { color: #8eaeff; background: rgb(82 117 232 / 12%); }
    .svn-error { margin-top: 7px; color: var(--bug); }
    .svn-workbench { min-width: 0; }
    .svn-workbench-header { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: -10px -10px 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
    .svn-workbench-title { display: flex; min-width: 0; align-items: center; gap: 12px; }
    .svn-workbench-kicker { color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .12em; }
    .svn-workbench-issue { display: flex; min-width: 0; align-items: baseline; gap: 8px; }
    .svn-workbench-issue h2 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .svn-workbench-stage { display: flex; flex: 0 0 auto; align-items: center; gap: 6px; }
    .svn-stage-step { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .svn-stage-step::before { width: 7px; height: 7px; border: 1px solid var(--line); border-radius: 50%; background: var(--panel); content: ""; }
    .svn-stage-step.done::before { border-color: var(--ok); background: var(--ok); }
    .svn-stage-step.active { color: var(--accent); font-weight: 700; }
    .svn-stage-step.active::before { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
    .svn-workbench-actions { display: flex; flex: 0 0 auto; gap: 7px; }
    .svn-workbench-actions .icon { width: 34px; padding: 0; font-size: 17px; }
    .svn-context-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; margin-bottom: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 9px; background: color-mix(in srgb, var(--bg) 82%, var(--panel)); color: var(--muted); font-size: 11px; }
    .svn-context-bar span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .svn-project-scope-select { display: grid; min-width: 0; grid-template-columns: auto minmax(180px, 1fr); align-items: center; gap: 8px; }
    .svn-project-scope-select > span { color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
    .svn-project-scope-select select { min-width: 0; height: 30px; padding: 0 28px 0 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; }
    .svn-project-scope-select select:disabled { opacity: .72; cursor: not-allowed; }
    .svn-project-scope-picker { display: grid; width: min(760px, 100%); align-self: center; margin: auto; gap: 22px; padding: 26px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
    .svn-project-scope-picker > div:first-child { display: grid; gap: 7px; }
    .svn-project-scope-picker h3 { margin: 0; font-size: 18px; }
    .svn-project-scope-picker p { max-width: 660px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .svn-scope-kicker { color: var(--accent); font-size: 10px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
    .svn-project-scope-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .svn-project-scope-card { display: grid; min-width: 0; gap: 5px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); text-align: left; }
    .svn-project-scope-card:hover { border-color: color-mix(in srgb, var(--accent) 52%, var(--line)); background: color-mix(in srgb, var(--accent) 7%, var(--card)); }
    .svn-project-scope-card.primary-scope { border-color: color-mix(in srgb, var(--accent) 34%, var(--line)); }
    .svn-project-scope-card > span { display: flex; min-width: 0; align-items: center; gap: 7px; }
    .svn-project-scope-card strong, .svn-project-scope-card small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .svn-project-scope-card strong { min-width: 0; font-size: 12px; }
    .svn-project-scope-card small { color: var(--muted); font-size: 10px; }
    .svn-project-scope-card em { flex: none; padding: 1px 5px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: 9px; font-style: normal; font-weight: 700; }
    .svn-workbench-grid { display: grid; min-width: 0; grid-template-columns: minmax(250px, 29%) minmax(330px, 1fr) minmax(270px, 31%); align-items: stretch; gap: 10px; }
    .svn-pane, .svn-workbench-side { min-width: 0; }
    .svn-pane, .svn-workbench-side { padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
    .svn-pane-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 9px; margin-bottom: 8px; }
    .svn-pane-head small { display: block; margin-top: 2px; color: var(--muted); }
    .svn-pane-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 5px; }
    .svn-pane-actions button { min-height: 28px; padding: 0 8px; font-size: 11px; }
    .svn-categories { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .svn-category { min-height: 27px; padding: 0 8px; border-radius: 5px; color: var(--muted); font-size: 11px; }
    .svn-category.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); color: var(--accent); }

    .svn-change-tag.deleted, .svn-change-tag.missing, .svn-change-tag.conflicted { background: color-mix(in srgb, var(--bug) 14%, transparent); color: var(--bug); }
    .svn-change-tag.modified, .svn-change-tag.replaced { background: color-mix(in srgb, var(--accent) 13%, transparent); color: var(--accent); }
    .svn-preview-empty { display: grid; min-height: 280px; place-items: center; padding: 24px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); text-align: center; }
    .svn-preview-surface { position: relative; min-height: 0; }
    .svn-preview-loading { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 20px; border-radius: 8px; background: color-mix(in srgb, var(--panel) 78%, transparent); backdrop-filter: blur(2px); }
    .svn-preview-loading .loader { max-width: min(320px, 88%); }
    .svn-preview-loading small { display: block; max-width: 240px; margin-top: 2px; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .svn-review-stack { display: grid; align-content: start; gap: 10px; }
    .svn-review-stack .svn-card { background: var(--panel); }
    .svn-side-primary { border-color: color-mix(in srgb, var(--accent) 32%, var(--line)); }
    .svn-review-mode-options { display: grid; gap: 7px; margin-top: 9px; }
    .svn-review-mode { display: grid !important; grid-template-columns: auto minmax(0, 1fr); gap: 8px; padding: 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; }
    .svn-review-mode.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); }
    .svn-review-mode input { margin-top: 3px; }
    .svn-review-mode strong, .svn-review-mode small { display: block; }
    .svn-review-mode small { margin-top: 2px; color: var(--muted); }
    .svn-message-label { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .svn-selected-row { display: grid; grid-template-columns: minmax(0, 1fr); align-items: center; gap: 7px; padding: 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); cursor: pointer; }
    .svn-selected-row span { min-width: 0; overflow-wrap: anywhere; }
    body.svn-mode { height: 100vh; padding: 0; overflow: hidden; -webkit-app-region: no-drag !important; }
    body.svn-mode #svn-view { height: 100vh; overflow: hidden; }

    body.svn-mode .svn-workbench-scroll { display: flex; min-height: 0; padding: 10px 12px 14px; overflow: hidden; flex: 1; flex-direction: column; }
    body.svn-mode .svn-workbench-grid { min-height: 0; flex: 1; }
    body.svn-mode .svn-pane, body.svn-mode .svn-workbench-side { min-height: 0; height: 100%; }
    body.svn-mode .svn-workbench-grid > .svn-pane:first-child { display: flex; flex-direction: column; }
    body.svn-mode .svn-files { min-height: 0; max-height: none; flex: 1; }
    body.svn-mode .svn-workbench-grid:not(.has-review) > .svn-pane:nth-child(2) { display: flex; min-height: 0; flex-direction: column; }
    body.svn-mode .svn-workbench-grid:not(.has-review) > .svn-pane:nth-child(2).svn-preview-surface,
    body.svn-mode .svn-workbench-grid:not(.has-review) > .svn-pane:nth-child(2) .svn-preview-surface { flex: 1; }
    body.svn-mode .svn-workbench-grid:not(.has-review) > .svn-pane:nth-child(2) .svn-preview-empty,
    body.svn-mode .svn-workbench-grid:not(.has-review) > .svn-pane:nth-child(2) .svn-diff { min-height: 0; max-height: none; flex: 1; }
    body.svn-mode .svn-workbench-side { overflow: hidden; }
    body.svn-mode .svn-review-stack { height: 100%; overflow: auto; }
    body.svn-mode #error { position: fixed; z-index: 40; top: 68px; right: 16px; left: 16px; box-shadow: var(--shadow); }
    body.svn-mode #loading { top: 57px; }
    [hidden] { display: none !important; }
    @media (max-width: 1080px) {
      .svn-workbench-grid { grid-template-columns: minmax(250px, 34%) minmax(0, 1fr); }
      .svn-workbench-side { display: grid; grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .svn-review-stack { display: contents; }
      .svn-workbench-stage .svn-stage-step span { display: none; }
      body.svn-mode .svn-workbench-scroll { overflow: auto; }
      body.svn-mode .svn-workbench-grid { min-height: auto; flex: 0 0 auto; }
      body.svn-mode .svn-pane, body.svn-mode .svn-workbench-side { height: auto; }
      body.svn-mode .svn-files, body.svn-mode .svn-diff { max-height: 360px; }
      body.svn-mode .svn-workbench-side { overflow: visible; }
    }
    @media (max-width: 660px) {
      .columns, .sheets-layout, .detail-grid, .svn-grid, .svn-workbench-grid, .svn-workbench-side { grid-template-columns: 1fr; }
      .sheet-list { max-height: 220px; }
      .svn-workbench-side { display: grid; grid-column: auto; }
      .svn-workbench-header { align-items: flex-start; gap: 8px; }
      .svn-workbench-stage { display: none; }
      .svn-workbench-issue h2 { white-space: normal; }
      .svn-context-bar { grid-template-columns: 1fr; }
      .svn-project-scope-list { grid-template-columns: 1fr; }

    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>

<body>
  <header>
    <div><div class="app-title-row"><h1>Jira 任务工作台</h1><button id="version-status" type="button" title="当前安装版本">v__JIRA_CODEX_VERSION__</button></div><div id="meta">等待任务数据…</div></div>
    <div class="toolbar"><div class="monitor"><span id="monitor-meta">自动 Bug 监控：读取中</span><button id="monitor-toggle" type="button" aria-pressed="false">开启</button></div><button id="settings" type="button">设置</button><button id="refresh" type="button">刷新</button><button id="local-close" type="button" aria-label="返回 Codex" title="返回 Codex" hidden>×</button></div>
  </header>
  <nav aria-label="工作台页签">
    <button type="button" data-tab="active" class="active">待我处理</button>
    <button type="button" data-tab="sheets">Jira Sheets</button>
    <button type="button" data-tab="history">处理历史</button>
  </nav>
  <div id="error" role="alert"></div>
  <div id="board-view">
    <main class="columns">
      <section class="requirement"><div class="section-title"><strong id="req-title">需求</strong><span id="requirement-count" class="count">0</span></div><div id="requirement-status-filters" class="status-filters"></div><div id="requirements" class="list"><div class="empty">暂无数据</div></div></section>
      <section class="bug"><div class="section-title"><strong id="bug-title">Bug</strong><span id="bug-count" class="count">0</span></div><div id="bug-status-filters" class="status-filters"></div><div id="bugs" class="list"><div class="empty">暂无数据</div></div></section>
    </main>
  </div>
  <div id="sheets-view" hidden>
    <div class="sheets-layout">
      <section><div class="section-title"><strong>可用 Sheets</strong><span id="sheet-count" class="count">0</span></div><div id="sheet-list" class="sheet-list"><div class="empty">点击页签读取</div></div></section>
      <section class="sheet-panel"><div class="sheet-toolbar"><input id="sheet-search" type="search" placeholder="筛选当前 Sheet"><select id="sheet-sort"><option value="updated">按更新时间</option><option value="key">按单号</option><option value="title">按标题</option><option value="status">按状态</option></select></div><h2 id="sheet-title">请选择 Sheet</h2><div id="sheet-issues" class="list"><div class="empty">从左侧选择一个 Sheet</div></div></section>
    </div>
  </div>
  <div id="detail-view" hidden></div>
  <div id="svn-view" hidden></div>
  <div id="loading"><div class="loader"><span class="spinner"></span><span id="loading-text">正在读取…</span></div></div>
  <script>
    const APP_VERSION = "__JIRA_CODEX_VERSION__";
    const TOOLS = { board: "jira_list_my_tasks", issue: "jira_get_issue", attachmentPreview: "jira_preview_issue_attachment", sheets: "jira_list_sheets", sheet: "jira_get_sheet_issues", transitions: "jira_list_transitions", prepareTransition: "jira_prepare_transition", executeTransition: "jira_execute_transition", threads: "codex_list_bindable_threads", bindIssue: "codex_bind_issue_to_thread", clearBinding: "codex_clear_issue_binding", openBoundThread: "codex_open_bound_issue_thread", createAnalysis: "codex_create_and_bind_issue_analysis", automationStatus: "jira_get_bug_monitor_status", automationToggle: "jira_set_bug_monitor_enabled", updateStatus: "jira_get_update_status", updateDownload: "jira_download_update", updateCancel: "jira_cancel_update_download", updateRestart: "jira_restart_to_complete_update", svnInspect: "svn_inspect_issue_changes", svnDiff: "svn_preview_issue_diff", svnExternalDiff: "svn_open_issue_external_diff", svnCreateReview: "svn_create_issue_review", svnGetReview: "svn_get_issue_review", svnCancelReview: "svn_cancel_issue_review", svnConfirmReview: "svn_confirm_issue_review", svnCommit: "svn_commit_issue_review", svnReconcile: "svn_reconcile_issue_commit", svnConfirmCommitted: "svn_confirm_issue_committed", svnAbandon: "svn_abandon_issue_review" };
    const DESKTOP_BRIDGE_TRANSPORT = document.documentElement.dataset.transport === "desktop-bridge";
    const LOCAL_TRANSPORT = DESKTOP_BRIDGE_TRANSPORT
      || new URLSearchParams(window.location.search).get("transport") === "http";
    const LOCAL_STATE_KEY = "jira-codex-mcp-app:widget-state:v1";
    const pending = new Map();
    const cache = { board: null, sheets: null, sheet: null, issue: null, attachmentPreview: null, transitions: null, pendingTransition: null, threads: null, automation: null, update: null, createAnalysisIssueKey: "", svnContext: null, svnPreview: null, svnReview: null, svnConfirmation: null };
    let requestId = 1;
    let activeTab = "active";
    let previousView = "board";
    let selectedSheet = null;
    let statusFilters = {};
    let svnSelectedPaths = new Set();
    let svnPollTimer = null;
    let updatePollTimer = null;
    let svnDedicatedMode = false;
    let svnCategoryFilter = "all";
    let svnDraftSummary = "";
    let svnDraftCodexReview = false;
    let busy = false;
    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    const fmtTime = (value) => value ? new Date(value).toLocaleString() : "—";
    const fmtSize = (value) => { const size = Number(value || 0); return size > 1048576 ? `${(size / 1048576).toFixed(1)} MB` : size > 1024 ? `${Math.round(size / 1024)} KB` : `${size} B`; };

    /* SVN_FILE_INTERACTION_START */
    function createSvnFileInteraction({ delay = 260, setTimer, clearTimer, canRun, select, needsPreview, preview, external }) {
      let previewTimer = null;
      const cancel = () => {
        if (previewTimer !== null) clearTimer(previewTimer);
        previewTimer = null;
      };
      return {
        click(event) {
          const row = event.target.closest(".svn-file[data-svn-preview-row], .svn-selected-row[data-svn-preview-row]");
          if (!row || event.target.closest("input, button") || !canRun()) return false;
          event.preventDefault();
          cancel();
          const path = row.dataset.svnPreviewRow;
          select(path);
          if (!needsPreview(path)) return true;
          previewTimer = setTimer(() => {
            previewTimer = null;
            if (canRun() && needsPreview(path)) preview(path);
          }, delay);
          return true;
        },
        doubleClick(event) {
          if (event.target.closest("input, button")) return false;
          const target = event.target.closest(".svn-file[data-svn-external-diff], .svn-selected-row[data-svn-external-diff], .svn-diff[data-svn-external-diff]");
          if (!target) return false;
          event.preventDefault();
          cancel();
          if (!canRun()) return false;
          if (target.dataset.svnPreviewRow) select(target.dataset.svnPreviewRow);
          external(target.dataset.svnExternalDiff);
          return true;
        },
        cancel,
        hasPendingPreview() { return previewTimer !== null; }
      };
    }
    /* SVN_FILE_INTERACTION_END */
    let svnActivePreviewPath = "";
    let svnPreviewRequestPath = "";
    function selectSvnPreviewPath(path) {
      svnActivePreviewPath = String(path || "");
      document.querySelectorAll("[data-svn-preview-row]").forEach((row) => {
        const active = row.dataset.svnPreviewRow === svnActivePreviewPath;
        row.classList.toggle("preview-active", active);
        if (active) row.setAttribute("aria-current", "true");
        else row.removeAttribute("aria-current");
      });
    }
    function needsSvnPreview(path) {
      return Boolean(path)
        && cache.svnPreview?.preview?.path !== path
        && svnPreviewRequestPath !== path;
    }
    function activeSvnProjectScopeId() {
      return String(
        cache.svnContext?.selectedProjectScopeId
        || cache.svnContext?.context?.workingCopy?.projectScopeId
        || ""
      );
    }
    function svnScopedArguments(extra = {}) {
      return {
        issueKey: cache.svnContext?.issueKey || cache.issue?.issue?.key || "",
        projectScopeId: activeSvnProjectScopeId(),
        ...extra
      };
    }
    async function loadSvnPreview(path) {
      if (!cache.svnContext || !needsSvnPreview(path)) return;
      svnPreviewRequestPath = path;
      renderSvn();
      try {
        const result = await callTool(
          TOOLS.svnDiff,
          svnScopedArguments({ path }),
          { busyScope: "svn-preview", accept: false }
        );
        if (result && svnPreviewRequestPath === path) acceptResult(result);
      } finally {
        if (svnPreviewRequestPath === path) {
          svnPreviewRequestPath = "";
          renderSvn();
        }
      }
    }
    const svnFileInteraction = createSvnFileInteraction({
      setTimer: (callback, delay) => window.setTimeout(callback, delay),
      clearTimer: (timer) => window.clearTimeout(timer),
      canRun: () => Boolean(cache.svnContext && !busy),
      select: selectSvnPreviewPath,
      needsPreview: needsSvnPreview,
      preview: (path) => void loadSvnPreview(path),
      external: (path) => void callTool(TOOLS.svnExternalDiff, svnScopedArguments({ path }))
    });

    const RETRYABLE_LOCAL_TOOLS = new Set([
      TOOLS.board, TOOLS.issue, TOOLS.attachmentPreview, TOOLS.sheets, TOOLS.sheet,
      TOOLS.transitions, TOOLS.threads, TOOLS.automationStatus,
      TOOLS.svnDiff, TOOLS.svnGetReview
    ]);
    async function desktopBridgeRequest(method, params, attempt = 0) {
      const id = requestId++;
      const toolName = method === "tools/call" ? String(params?.name || "") : "";
      const retryable = RETRYABLE_LOCAL_TOOLS.has(toolName);
      try {
        return await new Promise((resolve, reject) => {
          const timer = window.setTimeout(() => {
            pending.delete(id);
            const error = new Error("本地 MCP 响应超时，请刷新任务面板后重试。");
            error.code = "LOCAL_MCP_TIMEOUT";
            reject(error);
          }, toolName === TOOLS.svnInspect ? 90_000 : retryable ? 8_000 : 90_000);
          pending.set(id, {
            resolve: (value) => { window.clearTimeout(timer); resolve(value); },
            reject: (error) => { window.clearTimeout(timer); reject(error); }
          });
          window.parent.postMessage({ source: "jira-codex-local-ui", jsonrpc: "2.0", id, method, params }, "*");
        });
      } catch (error) {
        if (retryable && attempt === 0 && error?.code === "LOCAL_MCP_TIMEOUT") {
          return desktopBridgeRequest(method, params, 1);
        }
        throw error;
      }
    }
    async function localRequest(method, params) {
      if (DESKTOP_BRIDGE_TRANSPORT) return desktopBridgeRequest(method, params);
      const id = requestId++;
      const response = await fetch(new URL("/mcp", window.location.origin), {
        method: "POST",
        headers: {
          "content-type": "application/json",
          accept: "application/json, text/event-stream"
        },
        body: JSON.stringify({ jsonrpc: "2.0", id, method, params })
      });
      const payload = await response.json().catch(() => null);
      if (!response.ok || payload?.error) {
        const error = new Error(payload?.error?.message || `本地 MCP 请求失败（HTTP ${response.status}）。`);
        error.code = payload?.error?.data?.code || payload?.error?.code || "LOCAL_MCP_ERROR";
        error.data = payload?.error?.data;
        throw error;
      }
      return payload?.result;
    }
    function request(method, params) {
      if (LOCAL_TRANSPORT) return localRequest(method, params);
      const id = requestId++;
      window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
      return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
    }
    function notify(method, params) {
      if (!LOCAL_TRANSPORT) window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
    }
    function notifyDesktopHost(type, extra = {}) {
      if (LOCAL_TRANSPORT) window.parent.postMessage({ source: "jira-codex-local-ui", type, ...extra }, "*");
    }
    function openLink(url) {
      if (LOCAL_TRANSPORT) {
        notifyDesktopHost("open-link", { url });
        return Promise.resolve();
      }
      return request("ui/open-link", { url });
    }
    async function callTool(name, args = {}, options = {}) {
      const busyText = name === TOOLS.issue ? "正在读取任务详情…"
        : name === TOOLS.attachmentPreview ? "正在读取附件预览…"
        : name === TOOLS.sheets ? "正在读取 Sheets…"
        : name === TOOLS.sheet ? "正在读取 Sheet 内容…"
        : name === TOOLS.transitions ? "正在读取可用状态…"
        : name === TOOLS.prepareTransition ? "正在复核状态流转…"
        : name === TOOLS.executeTransition ? "正在提交 Jira 状态流转…"
        : name === TOOLS.threads ? "正在读取 Codex 会话…"
        : name === TOOLS.bindIssue ? "正在保存会话关联…"
        : name === TOOLS.clearBinding ? "正在解除会话关联…"
        : name === TOOLS.openBoundThread ? "正在打开 Codex 会话…"
        : name === TOOLS.createAnalysis ? "正在当前 Codex 窗口创建分析会话…"
        : name === TOOLS.automationStatus ? "正在读取自动监控状态…"
        : name === TOOLS.automationToggle ? "正在更新自动监控…"
        : name === TOOLS.updateStatus ? "正在检查 GitHub 更新…"
        : name === TOOLS.updateDownload ? "正在启动下载与自动安装…"
        : name === TOOLS.updateCancel ? "正在取消更新下载…"
        : name === TOOLS.updateRestart ? "正在准备重启 Codex…"
        : name === TOOLS.svnInspect ? "正在检查 SVN 工作副本…"
        : name === TOOLS.svnDiff ? "正在读取 SVN 差异…"
        : name === TOOLS.svnExternalDiff ? "正在打开 TortoiseSVN 差异比较…"
        : name === TOOLS.svnCreateReview ? "正在创建 SVN 审核快照…"
        : name === TOOLS.svnGetReview ? "正在刷新 SVN 审核…"
        : name === TOOLS.svnCancelReview ? "正在取消 Codex 审查…"
        : name === TOOLS.svnConfirmReview ? "正在复检 SVN 审核快照…"
        : name === TOOLS.svnCommit ? "正在复检并提交 SVN…"
        : name === TOOLS.svnReconcile ? "正在核对 SVN 日志…"
        : name === TOOLS.svnConfirmCommitted ? "正在登记人工核对结果…"
        : name === TOOLS.svnAbandon ? "正在放弃旧审核草稿…"
        : "正在同步任务…";
      const background = options.background === true;
      const localBusy = options.busyScope === "svn-preview" || background;
      if (!localBusy) setBusy(true, busyText);
      try {
        const result = await request("tools/call", { name, arguments: args });
        const output = result?.structuredContent;
        if (!output) throw new Error("工具没有返回结构化结果。");
        if (options.accept !== false) acceptResult(output);
        return output;
      } catch (error) {
        if (!background) showError(error);
        if (background && name === TOOLS.updateStatus) {
          if (updatePollTimer) clearTimeout(updatePollTimer);
          updatePollTimer = setTimeout(() => void callTool(TOOLS.updateStatus, {}, { background: true }), 1_500);
        }
        return null;
      } finally {
        if (!localBusy) setBusy(false);
      }
    }
    function setBusy(value, text = "正在读取…") {
      busy = value;
      $("loading-text").textContent = text;
      $("loading").classList.toggle("visible", value);
      $("refresh").disabled = value;
      const svnRefresh = $("refresh-svn-workbench");
      if (svnRefresh) svnRefresh.disabled = value;
    }
    function showError(error) { $("error").textContent = String(error?.message || error?.data?.message || "读取 Jira 数据失败。"); $("error").style.display = "block"; }
    function clearError() { $("error").style.display = "none"; }
    function saveState() {
      const state = { activeTab, selectedSheet: selectedSheet ? { projectId: selectedSheet.projectId, id: selectedSheet.id } : null, statusFilters };
      if (DESKTOP_BRIDGE_TRANSPORT) {
        notifyDesktopHost("save-state", { state });
        return;
      }
      if (LOCAL_TRANSPORT) {
        try { window.localStorage.setItem(LOCAL_STATE_KEY, JSON.stringify(state)); } catch {}
        return;
      }
      window.openai?.setWidgetState?.({ privateContent: state });

        void callTool(TOOLS.bindIssue, { issueKey: cache.issue.issue.key, threadId, expectedRevision: cache.threads.bindingsRevision, replaceExistingThreadBinding: conflicts.length > 0 });
      }
      if (event.target.closest("#clear-binding") && cache.issue?.issue?.binding && !busy) {
        if (!window.confirm(`确认解除 ${cache.issue.issue.key} 与“${cache.issue.issue.binding.title}”的关联吗？Codex 会话不会被删除。`)) return;
        void callTool(TOOLS.clearBinding, { issueKey: cache.issue.issue.key, expectedRevision: cache.issue.bindingsRevision });
      }
      if (event.target.closest("#open-svn") && cache.issue?.issue?.binding && !busy) {
        cache.svnContext = null; cache.svnPreview = null; cache.svnReview = null; cache.svnConfirmation = null; svnSelectedPaths = new Set();
        svnCategoryFilter = "all"; svnDraftSummary = ""; svnDraftCodexReview = false;
        void callTool(TOOLS.svnInspect, { issueKey: cache.issue.issue.key });
      }
      const svnProjectScope = event.target.closest("button[data-svn-project-scope]");
      if (svnProjectScope && cache.svnContext && !busy) {
        void callTool(TOOLS.svnInspect, {
          issueKey: cache.svnContext.issueKey,
          projectScopeId: svnProjectScope.dataset.svnProjectScope
        });
        return;
      }
      if (event.target.closest("#back-from-svn") || event.target.closest("#close-svn-workbench")) {
        svnFileInteraction.cancel();
        stopSvnPolling();
        if (svnDedicatedMode && LOCAL_TRANSPORT) notifyDesktopHost("close");
        else { $("svn-view").hidden = true; $("detail-view").hidden = false; renderDetail(); }
        return;
      }
      if (event.target.closest("#refresh-svn-workbench") && cache.svnContext && !busy) {
        if (cache.svnReview?.id) void callTool(TOOLS.svnGetReview, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id });
        else void callTool(TOOLS.svnInspect, svnScopedArguments());
      }
      const svnCategory = event.target.closest("button[data-svn-category]");
      if (svnCategory && !busy) {
        svnCategoryFilter = svnCategory.dataset.svnCategory || "all";
        renderSvn();
      }
      const svnCheckbox = event.target.closest("input[data-svn-path]");
      if (svnCheckbox && !busy) {
        if (svnCheckbox.checked) svnSelectedPaths.add(svnCheckbox.dataset.svnPath);
        else svnSelectedPaths.delete(svnCheckbox.dataset.svnPath);
        renderSvn();
      }
      svnFileInteraction.click(event);
      const svnExternalDiff = event.target.closest("button[data-svn-external-diff]");
      if (svnExternalDiff && cache.svnContext && !busy) {
        void callTool(TOOLS.svnExternalDiff, svnScopedArguments({ path: svnExternalDiff.dataset.svnExternalDiff }));
      }
      if (event.target.closest("#select-recommended") && cache.svnContext && !busy) {
        svnSelectedPaths = new Set((cache.svnContext.context?.changes || []).filter((change) => change.recommended && svnSelectable(change)).map((change) => change.path));
        renderSvn();
      }
      if (event.target.closest("#clear-svn-selection") && !busy) { svnSelectedPaths.clear(); renderSvn(); }
      if (event.target.closest("#create-svn-review") && cache.svnContext && !busy) {
        if (!svnSelectedPaths.size) return showError(new Error("请至少选择一个要审核的 SVN 文件。"));
        svnDraftSummary = $("svn-summary")?.value || svnDraftSummary;
        svnDraftCodexReview = $("svn-codex-review")?.checked === true;
        void callTool(TOOLS.svnCreateReview, {
          ...svnScopedArguments(),
          selectedPaths: Array.from(svnSelectedPaths),
          summary: svnDraftSummary,
          codexReviewEnabled: svnDraftCodexReview
        });
      }
      if (event.target.closest("#refresh-svn-review") && cache.svnReview && !busy) {
        void callTool(TOOLS.svnGetReview, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id });
      }
      if (event.target.closest("#cancel-svn-review") && cache.svnReview && !busy) {
        if (!window.confirm("确认取消 Codex 审查并改为人工审核吗？审核快照会保留。")) return;
        void callTool(TOOLS.svnCancelReview, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id, message: "用户已取消 Codex 审查，改为人工审核。" });
      }
      if (event.target.closest("#confirm-svn-review") && cache.svnReview && !busy) {
        if ($("svn-reviewed")?.checked !== true) return showError(new Error("请先人工查看全部选定文件和风险。"));
        if (cache.svnReview.verdict === "warning" && $("svn-risk")?.checked !== true) return showError(new Error("当前审核有警告，请确认理解风险。"));
        if (cache.svnReview.crossTaskConflicts?.length && $("svn-overlap")?.checked !== true) return showError(new Error("请先确认已核对多个任务混入同一文件的风险。"));
        void callTool(TOOLS.svnConfirmReview, {
          issueKey: cache.svnContext.issueKey,
          reviewId: cache.svnReview.id,
          reviewed: true,
          riskAcknowledged: $("svn-risk")?.checked === true,
          overlapAcknowledged: $("svn-overlap")?.checked === true
        });
      }
      if (event.target.closest("#commit-svn") && cache.svnReview && cache.svnConfirmation && !busy) {
        const message = `这将真实提交 ${cache.svnReview.selectedPaths?.length || 0} 个显式 SVN 路径。\n\n提交信息：\n${cache.svnReview.message || ""}\n\n确认继续吗？`;
        if (!window.confirm(message)) return;
        void (async () => {
          const result = await callTool(TOOLS.svnCommit, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id, confirmationToken: cache.svnConfirmation.confirmationToken });
          if (!result) await callTool(TOOLS.svnGetReview, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id });
        })();
      }
      if (event.target.closest("#reconcile-svn") && cache.svnReview && !busy) {
        void callTool(TOOLS.svnReconcile, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id });
      }
      if (event.target.closest("#confirm-svn-committed") && cache.svnReview && !busy) {
        const revision = $("svn-manual-revision")?.value?.trim() || "";
        if (!/^r?\d+$/i.test(revision)) return showError(new Error("请输入有效的 SVN revision。"));
        if (!window.confirm(`仅当你已经人工查看 SVN 日志并确认 ${revision} 提交成功时继续。不会再次提交。`)) return;
        void callTool(TOOLS.svnConfirmCommitted, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id, acknowledged: true, revision });
      }
      if (event.target.closest("#abandon-svn-review") && cache.svnReview && !busy) {
        if (!window.confirm("确认放弃当前审核草稿并重新扫描最新 SVN 文件状态吗？不会还原任何文件。")) return;
        void (async () => {
          const abandoned = await callTool(TOOLS.svnAbandon, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id, acknowledged: true, message: "用户已确认放弃旧审核草稿并重新扫描。" });
          if (abandoned) await callTool(TOOLS.svnInspect, svnScopedArguments());
        })();
      }
      if (event.target.closest("#execute-transition") && cache.issue?.issue && cache.transitions && !busy) {
        const transitionId = $("transition-select")?.value || "";
        const transition = cache.transitions.transitions.find((item) => item.id === transitionId);
        if (!transition) return showError(new Error("请先选择目标状态。"));
        if (!window.confirm(`确认将 ${cache.issue.issue.key} 从“${cache.issue.issue.statusName}”流转到“${transition.to.name}”吗？`)) return;
        void (async () => {
          const prepared = await callTool(TOOLS.prepareTransition, { issueKey: cache.issue.issue.key, transitionId: transition.id, expectedTargetStatus: transition.to.name });
          if (prepared?.confirmationId) await callTool(TOOLS.executeTransition, { confirmationId: prepared.confirmationId });
        })();
      }
    });
    document.addEventListener("dblclick", (event) => {
      svnFileInteraction.doubleClick(event);
    });
    document.addEventListener("keydown", (event) => { if ((event.key === "Enter" || event.key === " ") && event.target.matches("article[data-key]")) { event.preventDefault(); void openIssue(event.target.dataset.key); } });
    document.addEventListener("input", (event) => {
      if (event.target.id === "svn-summary") {
        svnDraftSummary = event.target.value;
        syncSvnCommitMessagePreview();
      }
    });
    document.addEventListener("change", (event) => {
      if (event.target.id === "svn-project-scope" && cache.svnContext && !cache.svnReview && !busy) {
        svnFileInteraction.cancel();
        cache.svnPreview = null;
        cache.svnConfirmation = null;
        svnSelectedPaths = new Set();
        svnActivePreviewPath = "";
        svnPreviewRequestPath = "";
        void callTool(TOOLS.svnInspect, {
          issueKey: cache.svnContext.issueKey,
          projectScopeId: event.target.value
        });
        return;
      }
      if (event.target.name === "svn-review-mode") {
        svnDraftCodexReview = event.target.value === "codex";
        document.querySelectorAll(".svn-review-mode").forEach((label) => label.classList.toggle("active", label.contains(event.target)));
      }
    });
    $("sheet-search").addEventListener("input", renderSheetIssues);
    $("sheet-sort").addEventListener("change", renderSheetIssues);
    $("refresh").addEventListener("click", () => { if (activeTab === "sheets") return callTool(selectedSheet ? TOOLS.sheet : TOOLS.sheets, selectedSheet ? { projectId: selectedSheet.projectId, sheetId: selectedSheet.id, limit: 100 } : {}); return callTool(TOOLS.board, { includeCompleted: true, limitPerType: 100 }); });

    window.addEventListener("message", (event) => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (!message || message.jsonrpc !== "2.0") return;
      if (message.id !== undefined && pending.has(message.id)) { const entry = pending.get(message.id); pending.delete(message.id); message.error ? entry.reject(message.error) : entry.resolve(message.result); return; }
      if (message.method === "ui/notifications/tool-result") acceptResult(message.params?.structuredContent);
    }, { passive: true });

    async function initialize() {
      let stored = window.openai?.widgetState?.privateContent || window.openai?.widgetState || {};
      if (LOCAL_TRANSPORT) {
        if (DESKTOP_BRIDGE_TRANSPORT) stored = window.__JIRA_CODEX_INITIAL_WIDGET_STATE__ || {};
        else {
          try { stored = JSON.parse(window.localStorage.getItem(LOCAL_STATE_KEY) || "{}"); } catch { stored = {}; }
        }
        $("local-close").hidden = false;
      }
      if (stored.openSvn) {
        svnDedicatedMode = true;
        document.body.classList.add("svn-mode");
        document.querySelector("body > header")?.setAttribute("hidden", "");
        document.querySelector("body > nav")?.setAttribute("hidden", "");
      }
      activeTab = ["active", "sheets", "history"].includes(stored.activeTab) ? stored.activeTab : "active";
      selectedSheet = stored.selectedSheet && typeof stored.selectedSheet === "object"
        ? { projectId: String(stored.selectedSheet.projectId || ""), id: String(stored.selectedSheet.id || "") }
        : null;
      statusFilters = stored.statusFilters && typeof stored.statusFilters === "object" && !Array.isArray(stored.statusFilters)
        ? Object.fromEntries(Object.entries(stored.statusFilters).map(([key, values]) => [key, Array.isArray(values) ? values.map(String) : []]))
        : {};
      try {
        if (LOCAL_TRANSPORT) {
          if (stored.openIssueKey) {
            await openIssue(String(stored.openIssueKey));
            if (stored.openSvn && cache.issue?.issue?.binding) {
              await callTool(TOOLS.svnInspect, { issueKey: String(stored.openIssueKey) });
            }
          } else {
            await callTool(TOOLS.board, { includeCompleted: true, limitPerType: 100 });
          }
          if (!stored.openSvn) await callTool(TOOLS.automationStatus);
          if (!stored.openSvn) void callTool(TOOLS.updateStatus, {}, { background: true });
        } else {
          await request("ui/initialize", { protocolVersion: "2025-11-21", appInfo: { name: "jira-workbench", title: "Jira 任务工作台", version: APP_VERSION }, appCapabilities: {} });
          notify("ui/notifications/initialized", {});
          void callTool(TOOLS.automationStatus);
          void callTool(TOOLS.updateStatus, {}, { background: true });
        }
      } catch (error) {
        if (window.openai?.toolOutput) acceptResult(window.openai.toolOutput);
        else showError(error);
      }
      document.querySelectorAll("nav button").forEach((button) => button.classList.toggle("active", button.dataset.tab === activeTab));
    }
    void initialize();
  </script>
</body>
</html>
