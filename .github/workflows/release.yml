name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node packages/codex/scripts/verify-release-version.mjs "${{ github.ref_name }}"
      - run: npm test
      - name: Refresh Plugin cachebuster for this Release package
        run: node packages/codex/scripts/set-plugin-cachebuster.mjs "release-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Build signed-input Release assets
        shell: pwsh
        run: ./packages/codex/scripts/build-release.ps1
      - name: Attest Windows archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/jira-codex-assistant-*-win-x64.zip
      - name: Create or update published GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          $releaseJson = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($release.isDraft) {
              gh release edit $tag --draft=false --latest
            }
          } else {
            gh release create $tag @assets --verify-tag --generate-notes --title $tag --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
