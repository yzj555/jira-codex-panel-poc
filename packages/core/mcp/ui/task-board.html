<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jira 任务工作台</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f7f9; --panel: #fff; --card: #fff; --line: #e4e7eb; --line-strong: #cfd5dc;
      --soft: #f0f3f7; --hover: #edf2fb; --text: #20242a; --muted: #737d89; --accent: #5272d2;
      --accent-hover: #4665bf; --accent-soft: #edf1fd; --req: #5c73c9; --bug: #c8675d; --ok: #438e6b; --warn: #b88135;
      --shadow: 0 16px 42px rgb(25 35 55 / 14%);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181a1d; --panel: #202328; --card: #24282d; --line: #32373e; --line-strong: #48505a;
        --soft: #2a2f35; --hover: #303846; --text: #f2f3f5; --muted: #9aa3ad; --accent: #82a9ff;
        --accent-hover: #9abaff; --accent-soft: #293752; --req: #82a9ff; --bug: #ff8f84; --ok: #68d097; --warn: #efb25c; --shadow: 0 18px 46px rgb(0 0 0 / 38%);
      }
    }
    :root[data-theme="dark"] {
      --bg: #181a1d; --panel: #202328; --card: #24282d; --line: #32373e; --line-strong: #48505a;
      --soft: #2a2f35; --hover: #303846; --text: #f2f3f5; --muted: #9aa3ad; --accent: #82a9ff;
      --accent-hover: #9abaff; --accent-soft: #293752; --req: #82a9ff; --bug: #ff8f84; --ok: #68d097; --warn: #efb25c; --shadow: 0 18px 46px rgb(0 0 0 / 38%);
    }
    :root[data-theme="light"] {
      --bg: #f6f7f9; --panel: #fff; --card: #fff; --line: #e4e7eb; --line-strong: #cfd5dc;
      --soft: #f0f3f7; --hover: #edf2fb; --text: #20242a; --muted: #737d89; --accent: #5272d2;
      --accent-hover: #4665bf; --accent-soft: #edf1fd; --req: #5c73c9; --bug: #c8675d; --ok: #438e6b; --warn: #b88135;
      --shadow: 0 16px 42px rgb(25 35 55 / 14%);
    }
    * { box-sizing: border-box; }
    body { display: flex; height: 100vh; min-height: 0; margin: 0; padding: 12px; overflow: hidden; background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 4%, var(--bg)) 0, var(--bg) 146px); color: var(--text); font: 13px/1.5 "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", ui-sans-serif, system-ui, sans-serif; flex-direction: column; }
    button, select, input { color: inherit; font: inherit; }
    button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 8px; outline: 0; background: var(--soft); cursor: pointer; font-weight: 600; transition: color .16s ease, background-color .16s ease, opacity .16s ease, transform .16s ease; }
    button:hover { background: var(--hover); color: var(--accent); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
    button:disabled { opacity: .52; cursor: not-allowed; }
    .app-header { position: relative; display: flex; flex: 0 0 auto; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; padding: 2px 4px 10px 12px; border-bottom: 1px solid color-mix(in srgb, var(--line) 82%, transparent); }
    .app-header::before { position: absolute; top: 4px; bottom: 12px; left: 0; width: 3px; border-radius: 3px; background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 38%, var(--req))); content: ""; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 17px; }
    .app-title-row { display: flex; align-items: center; gap: 8px; }
    #version-status { min-height: 22px; padding: 1px 7px; border-color: var(--line); border-radius: 999px; background: var(--soft); color: var(--muted); font-size: 10px; font-weight: 680; }
    #version-status:not(.update-available) { cursor: default; }
    #version-status.update-available { border-color: color-mix(in srgb, var(--warn) 50%, var(--line)); background: color-mix(in srgb, var(--warn) 12%, var(--panel)); color: var(--warn); cursor: pointer; }
    #version-status.action-required { border-color: color-mix(in srgb, var(--accent) 52%, var(--line)); background: color-mix(in srgb, var(--accent) 12%, var(--panel)); color: var(--accent); cursor: pointer; }
    h2 { font-size: 15px; }
    #meta { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .toolbar { display: flex; align-items: center; gap: 8px; }
    #local-close { width: 34px; padding: 0; font-size: 20px; line-height: 1; }
    .monitor { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; }
    .monitor button[aria-pressed="true"] { border-color: var(--ok); color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--panel)); }
    nav { display: flex; flex: 0 0 auto; gap: 18px; margin-bottom: 12px; padding: 0; border-bottom: 1px solid var(--line); background: transparent; }
    nav button { position: relative; flex: 1; border: 0; border-radius: 0; background: transparent; }
    nav button::after { position: absolute; right: 0; bottom: -1px; left: 0; height: 2px; border-radius: 2px; background: transparent; content: ""; }
    nav button.active { background: transparent; color: var(--text); box-shadow: none; font-weight: 680; }
    nav button.active::after { background: var(--accent); }
    #error { display: none; flex: 0 0 auto; margin-bottom: 10px; padding: 9px 10px; border-radius: 8px; background: color-mix(in srgb, var(--bug) 16%, transparent); color: var(--bug); }
    #loading { display: none; position: fixed; inset: 0; z-index: 30; align-items: center; justify-content: center; background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(2px); }
    #loading.visible { display: flex; }
    .loader { display: flex; align-items: center; gap: 9px; padding: 12px 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); box-shadow: var(--shadow); }
    .spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #board-view, #sheets-view, #detail-view, #svn-view { min-height: 0; overflow: hidden; flex: 1; }
    .columns { display: grid; height: 100%; min-height: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .columns > section, .sheets-layout > section, .sheet-panel, .detail { min-width: 0; padding: 10px; border: 1px solid color-mix(in srgb, var(--line) 88%, transparent); border-radius: 10px; background: color-mix(in srgb, var(--panel) 96%, var(--accent-soft)); box-shadow: 0 7px 22px rgb(28 38 58 / 5%); }
    .columns > section { display: flex; min-height: 0; overflow: hidden; flex-direction: column; }
    .columns > section.requirement { border-top: 2px solid color-mix(in srgb, var(--req) 66%, var(--line)); }
    .columns > section.bug { border-top: 2px solid color-mix(in srgb, var(--bug) 62%, var(--line)); }
    .section-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid color-mix(in srgb, var(--line) 76%, transparent); font-weight: 650; }
    .section-title .count { min-width: 25px; padding: 1px 7px; border-radius: 5px; color: var(--muted); background: var(--soft); text-align: center; font-size: 11px; }
    .status-filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 9px; }
    .status-filter { min-height: 27px; padding: 0 8px; border-radius: 5px; color: var(--muted); font-size: 11px; }
    .status-filter.active { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); color: var(--accent); }
    .requirement .section-title strong { color: var(--req); }
    .bug .section-title strong { color: var(--bug); }
    .list { display: grid; min-height: 0; overflow: auto; align-content: start; gap: 0; flex: 1; scrollbar-gutter: stable; }
    article { min-width: 0; padding: 10px 9px; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; box-shadow: none; cursor: pointer; transition: background-color .11s ease, box-shadow .11s ease; }
    article:last-child { border-bottom: 0; }
    article:hover { border-color: var(--line); background: var(--hover); box-shadow: inset 3px 0 0 color-mix(in srgb, var(--accent) 58%, transparent); }
    .bug article:hover { box-shadow: inset 3px 0 0 color-mix(in srgb, var(--bug) 62%, transparent); }
    .task-head, .task-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
    .key { color: var(--accent); font-weight: 700; }
    .title { margin: 5px 0; overflow-wrap: anywhere; font-weight: 600; }
    .pill { display: inline-flex; align-items: center; max-width: 140px; padding: 1px 6px; border-radius: 4px; background: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill.status-todo, .detail-status.status-todo { background: color-mix(in srgb, var(--muted) 9%, var(--panel)); color: var(--muted); }
    .pill.status-doing, .detail-status.status-doing { background: color-mix(in srgb, var(--accent) 11%, var(--panel)); color: var(--accent); }
    .pill.status-done, .detail-status.status-done { background: color-mix(in srgb, var(--ok) 12%, var(--panel)); color: var(--ok); }
    .bound { color: var(--ok); }
    .empty { padding: 24px 8px; color: var(--muted); text-align: center; }
    body.sheets-active #sheets-view { min-height: 0; flex: 1; overflow: hidden; }
    .sheets-layout { display: grid; height: 100%; min-height: 0; grid-template-columns: minmax(180px, 220px) minmax(0, 1fr); gap: 12px; }
    .sheet-directory { display: flex; min-width: 0; min-height: 0; padding: 11px; overflow: hidden; border: 1px solid color-mix(in srgb, var(--line) 88%, transparent); border-radius: 10px; background: color-mix(in srgb, var(--panel) 96%, var(--accent-soft)); box-shadow: 0 7px 22px rgb(28 38 58 / 5%); flex-direction: column; }
    .sheet-list { display: grid; min-height: 0; overflow: auto; align-content: start; gap: 2px; padding-right: 2px; scrollbar-gutter: stable; }
    .sheet-item { width: 100%; min-height: 46px; padding: 7px 9px; border-radius: 7px; background: transparent; text-align: left; }
    .sheet-item:hover { background: var(--hover); }
    .sheet-item.active { background: color-mix(in srgb, var(--accent) 13%, var(--panel)); color: var(--accent); }
    .sheet-item strong, .sheet-item small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-item small { margin-top: 2px; color: var(--muted); font-size: 10px; font-weight: 500; }
    .sheet-panel { display: flex; min-width: 0; min-height: 0; padding: 0 !important; overflow: hidden; flex-direction: column; }
    .sheet-panel-head { display: grid; gap: 9px; padding: 11px 13px; border-bottom: 1px solid var(--line); }
    .sheet-title-row { display: flex; min-width: 0; align-items: baseline; justify-content: space-between; gap: 10px; }
    .sheet-title-row h2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-visible-count { flex: 0 0 auto; color: var(--muted); font-size: 11px; }
    .sheet-toolbar { display: flex; align-items: center; gap: 8px; }
    .sheet-toolbar input { min-width: 0; min-height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; outline: 0; background: var(--panel); flex: 1; }
    .sheet-toolbar input:focus { border-color: color-mix(in srgb, var(--accent) 58%, var(--line)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 10%, transparent); }
    .sheet-reset { min-height: 34px; background: var(--soft); color: var(--muted); }
    .sheet-table-wrap { min-height: 0; overflow: auto; flex: 1; scrollbar-gutter: stable; }
    .sheet-table { width: 100%; min-width: 1080px; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
    .sheet-table th, .sheet-table td { padding: 8px 9px; border-right: 1px solid color-mix(in srgb, var(--line) 78%, transparent); border-bottom: 1px solid var(--line); overflow: hidden; text-align: left; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-table th:last-child, .sheet-table td:last-child { border-right: 0; }
    .sheet-table thead { position: sticky; z-index: 4; top: 0; }
    .sheet-table thead th { padding: 0; background: color-mix(in srgb, var(--soft) 78%, var(--panel)); color: var(--muted); font-size: 11px; font-weight: 650; }
    .sheet-sort { width: 100%; min-height: 34px; justify-content: space-between; padding: 0 9px; border-radius: 0; background: transparent; color: inherit; text-align: left; }
    .sheet-sort:hover, .sheet-sort.active { background: color-mix(in srgb, var(--accent) 10%, var(--panel)); color: var(--accent); }
    .sheet-sort-mark { margin-left: 5px; font-size: 10px; }
    .sheet-filter-row { position: sticky; z-index: 3; top: 34px; }
    .sheet-filter-row th { padding: 5px 6px; background: var(--panel); }
    .sheet-filter { width: 100%; min-width: 0; height: 29px; padding: 0 7px; border: 1px solid var(--line); border-radius: 6px; outline: 0; background: var(--panel); color: var(--text); font: inherit; font-size: 10px; }
    .sheet-filter:focus, .sheet-filter.active { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: var(--accent-soft); }
    .sheet-row { cursor: pointer; }
    .sheet-row:hover, .sheet-row:focus-visible { outline: 0; background: var(--hover); }
    .sheet-row:hover td:first-child, .sheet-row:focus-visible td:first-child { box-shadow: inset 3px 0 0 color-mix(in srgb, var(--accent) 65%, transparent); }
    .sheet-key strong { margin-left: 6px; color: var(--accent); }
    .sheet-type-mark { display: inline-flex; padding: 1px 6px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); font-size: 10px; }
    .sheet-type-mark.bug { background: color-mix(in srgb, var(--bug) 12%, var(--panel)); color: var(--bug); }
    .sheet-status-mark { display: inline-flex; max-width: 100%; padding: 2px 6px; border-radius: 5px; background: var(--soft); overflow: hidden; text-overflow: ellipsis; }
    .sheet-no-results td { padding: 28px 12px; color: var(--muted); text-align: center; }
    body.detail-active #detail-view { min-height: 0; flex: 1; }
    .detail-shell { position: relative; display: grid; height: 100%; min-height: 0; padding: 0; overflow: hidden; grid-template-rows: auto minmax(0, 1fr); }
    .detail-head { display: flex; min-width: 0; align-items: flex-start; justify-content: space-between; gap: 14px; margin: 0; padding: 15px 18px 14px; border-bottom: 1px solid var(--line); }
    .detail-head > div { min-width: 0; }
    .detail-head h2 { margin-top: 3px; overflow: hidden; font-size: 17px; line-height: 1.4; text-overflow: ellipsis; white-space: nowrap; }
    .detail-title-meta { display: flex; align-items: center; gap: 8px; }
    .detail-status { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11px; }
    .detail-status::before { width: 6px; height: 6px; border-radius: 50%; background: currentColor; content: ""; }
    .back { flex: 0 0 auto; display: inline-flex; min-width: 0; min-height: 38px; align-items: center; gap: 7px; padding: 0 13px 0 10px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 12%, var(--panel)); color: var(--accent); font-weight: 650; }
    .back:hover { background: color-mix(in srgb, var(--accent) 19%, var(--panel)); color: var(--accent); transform: translateX(-1px); }
    .back-icon { font-size: 17px; font-weight: 500; line-height: 1; }
    .detail-body { position: relative; min-height: 0; overflow: hidden; }
    .detail-scroll { height: 100%; min-height: 0; padding: 18px 20px 28px; overflow: auto; overscroll-behavior: contain; }
    .detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(270px, 31%); gap: 26px; }
    .detail-side-rail { position: sticky; top: 0; display: grid; min-width: 0; align-self: start; gap: 14px; }
    .description { padding: 13px 14px; border-radius: 9px; background: color-mix(in srgb, var(--soft) 70%, var(--panel)); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.65; }
    .parent-context { margin-top: 16px; padding: 13px 15px; border: 0; border-left: 3px solid color-mix(in srgb, var(--accent) 72%, transparent); border-radius: 0 9px 9px 0; background: color-mix(in srgb, var(--accent-soft) 52%, var(--panel)); }
    .parent-context-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .parent-context-head span { color: var(--muted); font-size: 11px; }
    .parent-context-head a { color: var(--accent); text-decoration: none; }
    .parent-context h3 { margin: 0 0 8px; font-size: 14px; }
    .parent-context .description { padding: 11px 12px; background: color-mix(in srgb, var(--panel) 62%, transparent); }
    .scope-note { margin-top: 9px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .facts { display: grid; align-content: start; gap: 0; padding: 2px 0 2px 18px; border-left: 1px solid var(--line); }
    .fact { display: grid; grid-template-columns: 72px minmax(0,1fr); gap: 10px; padding: 8px 0; }
    .fact span:first-child { color: var(--muted); }
    .fact strong { overflow-wrap: anywhere; font-weight: 600; }
    .subsection { margin-top: 18px; }
    .subsection > strong { font-size: 13px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip { padding: 4px 8px; border-radius: 7px; background: var(--soft); color: var(--text); }
    .attachments { display: grid; gap: 0; margin-top: 7px; border-top: 1px solid var(--line); }
    .attachment { padding: 9px 4px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
    .attachment small { display: block; margin-top: 2px; color: var(--muted); }
    .attachment button { width: 100%; min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent; text-align: left; }
    .attachment button:hover { background: transparent; }
    .attachment-preview { margin-top: 10px; padding: 10px; border-radius: 10px; background: var(--soft); }
    .attachment-preview-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .attachment-preview-nav { display: inline-flex; align-items: center; gap: 5px; }
    .attachment-preview-nav button { width: 30px; min-height: 28px; padding: 0; background: var(--panel); color: var(--text); text-align: center; }
    .attachment-preview-nav button:disabled { opacity: .35; cursor: default; }
    .attachment-preview-nav small { color: var(--muted); white-space: nowrap; }
    .attachment-preview-stage { position: relative; display: grid; width: 100%; height: clamp(320px, 52vh, 680px); min-height: 0; margin-top: 8px; padding: 12px; overflow: hidden; border-radius: 8px; background: color-mix(in srgb, var(--panel) 86%, var(--soft)); cursor: zoom-in; place-items: center; }
    .attachment-preview-stage:hover { background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
    .attachment-preview-stage img { display: block; width: 100%; height: 100%; min-height: 0; margin: 0; border-radius: 6px; object-fit: contain; image-rendering: auto; }
    .attachment-preview-zoom { position: absolute; right: 12px; bottom: 10px; padding: 4px 8px; border-radius: 6px; background: rgb(20 27 38 / 70%); color: #fff; font-size: 10px; font-weight: 600; opacity: .82; pointer-events: none; }
    .attachment-lightbox { position: fixed; z-index: 80; inset: 0; display: grid; padding: 18px; background: rgb(10 14 22 / 88%); backdrop-filter: blur(5px); grid-template-rows: auto minmax(0, 1fr); }
    .attachment-lightbox-head { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 14px; padding: 0 2px 12px; color: #fff; }
    .attachment-lightbox-head > strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attachment-lightbox-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 7px; }
    .attachment-lightbox-actions button { min-width: 38px; min-height: 38px; background: rgb(255 255 255 / 13%); color: #fff; }
    .attachment-lightbox-actions button:hover { background: rgb(255 255 255 / 22%); color: #fff; }
    .attachment-lightbox-actions button:disabled { opacity: .32; }
    .attachment-lightbox-counter { min-width: 48px; color: rgb(255 255 255 / 72%); text-align: center; font-size: 11px; }
    .attachment-lightbox-stage { display: grid; min-width: 0; min-height: 0; overflow: hidden; place-items: center; }
    .attachment-lightbox-stage img { display: block; width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: contain; image-rendering: auto; }
    .binding-box { margin-top: 10px; padding: 11px; border-radius: 9px; background: var(--soft); }
    .binding-box select { width: 100%; min-height: 36px; margin: 7px 0; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 8px; outline: 0; background: var(--panel); }
    .analysis-project-field { display: grid !important; gap: 5px !important; }
    .analysis-project-field > span { color: var(--muted); font-size: 12px; font-weight: 600; }
    .analysis-project-field select { margin: 0; }
    .binding-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .binding-actions button { min-width: 0; flex: 1; }
    .binding-actions .danger { background: transparent; color: var(--bug); }
    .binding-current { margin-top: 5px; overflow-wrap: anywhere; font-weight: 600; }
    .workspace-scope-list { display: grid; gap: 4px; margin-top: 7px; }
    .workspace-scope-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 7px; padding: 7px 8px; border-radius: 7px; background: var(--panel); }
    .workspace-scope-row span { min-width: 0; }
    .workspace-scope-row strong, .workspace-scope-row small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .workspace-scope-row small { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .workspace-scope-row button { padding: 4px 7px; background: transparent; color: var(--bug); }
    .workspace-binding-form { display: grid; gap: 6px; margin-top: 8px; }
    .workspace-binding-form input[type="text"] { width: 100%; min-height: 36px; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 8px; outline: 0; background: var(--panel); color: var(--text); font: inherit; }
    .workspace-binding-options { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 10px; }

      if (event.target.closest("#association-clear-session") && cache.issue?.issue?.binding && !busy) {
        const task = cache.issue.issue;
        if (!window.confirm(`确认解除 ${task.key} 与“${task.binding.title}”的关联吗？DSH 会话不会被删除。`)) return;
        void (async () => {
          const result = await callTool(TOOLS.clearBinding, { issueKey: task.key, expectedRevision: cache.issue.bindingsRevision });
          if (result) {
            associationOpen = false;
            renderDetail({ modalOnly: true, patchSelectors: [".detail-side-rail"] });
          }
        })();
      }
      if (event.target.closest("#open-binding") && cache.issue?.issue && !busy) {
        void callTool(TOOLS.threads, { limit: 100 });
      }
      if (event.target.closest("#open-bound-thread") && cache.issue?.issue?.binding && !busy) {
        if (HOST_KIND === "dsh") {
          window.parent.postMessage({
            source: "jira-workbench-dsh",
            type: "open-session",
            sessionId: cache.issue.issue.binding.threadId
          }, window.location.origin);
        } else {
          void callTool(TOOLS.openBoundThread, { issueKey: cache.issue.issue.key });
        }
      }
      if (event.target.closest("#create-analysis") && cache.issue?.issue && !busy) {
        cache.createAnalysisIssueKey = cache.issue.issue.key;
        renderDetail();
      }
      if (event.target.closest("#cancel-create-analysis") && !busy) {
        cache.createAnalysisIssueKey = "";
        renderDetail();
      }
      if (event.target.closest("#confirm-create-analysis") && cache.issue?.issue && !busy) {
        const supplementalDescription = $("analysis-supplement")?.value?.trim() || "";
        const projectScopeId = $("analysis-project-scope")?.value || "";
        if (HOST_KIND === "dsh" && !projectScopeId) return showError(new Error("请先选择用于新会话的 DSH 项目。"));
        if (!window.confirm(`确认在 ${SESSION_HOST_NAME} 为 ${cache.issue.issue.key} 新建会话，并发送一条只读分析消息吗？`)) return;
        void callTool(TOOLS.createAnalysis, {
          issueKey: cache.issue.issue.key,
          supplementalDescription,
          expectedRevision: cache.issue.bindingsRevision,
          expectedThreadId: cache.issue.issue.binding?.threadId || "",
          ...(projectScopeId ? { projectScopeId } : {})
        });
      }
      if (event.target.closest("#cancel-binding") && !busy) {
        cache.threads = null;
        renderDetail();
      }
      if (event.target.closest("#confirm-binding") && cache.issue?.issue && cache.threads && !busy) {
        const threadId = $("binding-thread-select")?.value || "";
        const thread = cache.threads.threads.find((item) => item.id === threadId);
        if (!thread) return showError(new Error(`请先选择要关联的 ${SESSION_HOST_NAME} 会话。`));
        const conflicts = (thread.boundIssueKeys || []).filter((issueKey) => issueKey !== cache.issue.issue.key);
        const message = conflicts.length
          ? `该会话已关联 ${conflicts.join("、")}。确认解除原关联并改为关联 ${cache.issue.issue.key} 吗？不会发送消息。`
          : `确认将 ${cache.issue.issue.key} 关联到“${thread.title}”吗？不会发送消息。`;
        if (!window.confirm(message)) return;
        void callTool(TOOLS.bindIssue, { issueKey: cache.issue.issue.key, threadId, expectedRevision: cache.threads.bindingsRevision, replaceExistingThreadBinding: conflicts.length > 0 });
      }
      if (event.target.closest("#clear-binding") && cache.issue?.issue?.binding && !busy) {
        if (!window.confirm(`确认解除 ${cache.issue.issue.key} 与“${cache.issue.issue.binding.title}”的关联吗？${SESSION_HOST_NAME} 会话不会被删除。`)) return;
        void callTool(TOOLS.clearBinding, { issueKey: cache.issue.issue.key, expectedRevision: cache.issue.bindingsRevision });
      }
      if (event.target.closest("#refresh-workspace-catalog") && !busy) {
        void callTool(TOOLS.workspaceList, {});
      }
      if (event.target.closest("#bind-workspace") && cache.issue?.issue && cache.workspaces && !busy) {
        const selectedWorkspaceId = $("workspace-select")?.value || "";
        const selectedWorkspace = (cache.availableWorkspaces?.workspaces || []).find((workspace) => workspace.id === selectedWorkspaceId);
        const cwd = selectedWorkspace?.cwd || $("workspace-path")?.value?.trim() || "";
        const projectId = selectedWorkspace?.projectId || selectedWorkspace?.id || "";
        const projectLabel = selectedWorkspace?.projectLabel || $("workspace-label")?.value?.trim() || "";
        if (hasTool(TOOLS.workspaceList) && !selectedWorkspace) return showError(new Error("请先从 DSH 项目列表选择一个项目。"));
        if (!cwd) return showError(new Error("请填写本机项目绝对路径。"));
        if (!window.confirm(`确认将“${projectLabel || cwd}”绑定到 ${cache.issue.issue.key} 吗？该项目将可用于 SVN 检查与提交。`)) return;
        void callTool(TOOLS.workspaceBind, {
          issueKey: cache.issue.issue.key,
          cwd,
          projectId,
          projectLabel,
          makeDefault: $("workspace-default")?.checked !== false,
          replaceExisting: false,
          expectedRevision: cache.workspaces.revision
        });
      }
      const unbindWorkspace = event.target.closest("button[data-unbind-workspace]");
      if (unbindWorkspace && cache.issue?.issue && cache.workspaces && !busy) {
        if (!window.confirm("确认解除这个项目目录吗？不会删除目录或还原文件。")) return;
        void callTool(TOOLS.workspaceUnbind, {
          issueKey: cache.issue.issue.key,
          projectScopeId: unbindWorkspace.dataset.unbindWorkspace,
          expectedRevision: cache.workspaces.revision
        });
      }
      if (event.target.closest("#clear-workspaces") && cache.issue?.issue && cache.workspaces && !busy) {
        if (!window.confirm(`确认解除 ${cache.issue.issue.key} 的全部项目目录吗？不会删除任何本机文件。`)) return;
        void callTool(TOOLS.workspaceUnbind, {
          issueKey: cache.issue.issue.key,
          projectScopeId: "",
          expectedRevision: cache.workspaces.revision
        });
      }
      const hasSvnWorkspace = (cache.workspaces?.binding?.workspace?.projectScopes || []).length > 0
        || (cache.issue?.issue?.binding?.projectScopes || []).length > 0;
      if (event.target.closest("#open-svn") && cache.issue?.issue && hasSvnWorkspace && !busy) {
        cache.svnContext = null; cache.svnPreview = null; cache.svnReview = null; cache.svnConfirmation = null; svnSelectedPaths = new Set();
        svnCategoryFilter = "all"; svnDraftSummary = ""; svnDraftCodexReview = false;
        void callTool(TOOLS.svnInspect, { issueKey: cache.issue.issue.key });
      }
      const svnProjectScope = event.target.closest("button[data-svn-project-scope]");
      if (svnProjectScope && cache.svnContext && !busy) {
        void callTool(TOOLS.svnInspect, {
          issueKey: cache.svnContext.issueKey,
          projectScopeId: svnProjectScope.dataset.svnProjectScope
        });
        return;
      }
      if (event.target.closest("#back-from-svn") || event.target.closest("#close-svn-workbench")) {
        svnFileInteraction.cancel();
        stopSvnPolling();
        if (svnDedicatedMode && LOCAL_TRANSPORT) notifyDesktopHost("close");
        else { leaveSvnLayout(); document.body.classList.add("detail-active"); $("svn-view").hidden = true; $("detail-view").hidden = false; renderDetail(); }
        return;
      }
      if (event.target.closest("#refresh-svn-workbench") && cache.svnContext && !busy) {
        if (cache.svnReview?.id) void callTool(TOOLS.svnGetReview, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id });
        else void callTool(TOOLS.svnInspect, svnScopedArguments());
      }
      const svnCategory = event.target.closest("button[data-svn-category]");
      if (svnCategory && !busy) {
        svnCategoryFilter = svnCategory.dataset.svnCategory || "all";
        renderSvn();
      }
      const svnCheckbox = event.target.closest("input[data-svn-path]");
      if (svnCheckbox && !busy) {
        if (svnCheckbox.checked) svnSelectedPaths.add(svnCheckbox.dataset.svnPath);
        else svnSelectedPaths.delete(svnCheckbox.dataset.svnPath);
        renderSvn();
      }
      svnFileInteraction.click(event);
      const svnExternalDiff = event.target.closest("button[data-svn-external-diff]");
      if (svnExternalDiff && cache.svnContext && !busy) {
        void callTool(TOOLS.svnExternalDiff, svnScopedArguments({ path: svnExternalDiff.dataset.svnExternalDiff }));
      }
      if (event.target.closest("#select-recommended") && cache.svnContext && !busy) {
        svnSelectedPaths = new Set((cache.svnContext.context?.changes || []).filter((change) => change.recommended && svnSelectable(change)).map((change) => change.path));
        renderSvn();
      }
      if (event.target.closest("#clear-svn-selection") && !busy) { svnSelectedPaths.clear(); renderSvn(); }
      if (event.target.closest("#create-svn-review") && cache.svnContext && !busy) {
        if (!svnSelectedPaths.size) return showError(new Error("请至少选择一个要审核的 SVN 文件。"));
        svnDraftSummary = $("svn-summary")?.value || svnDraftSummary;
        svnDraftCodexReview = cache.svnContext.capabilities?.codexReview === true
          && $("svn-codex-review")?.checked === true;
        void callTool(TOOLS.svnCreateReview, {
          ...svnScopedArguments(),
          selectedPaths: Array.from(svnSelectedPaths),
          summary: svnDraftSummary,
          codexReviewEnabled: svnDraftCodexReview
        });
      }
      if (event.target.closest("#refresh-svn-review") && cache.svnReview && !busy) {
        void callTool(TOOLS.svnGetReview, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id });
      }
      if (event.target.closest("#cancel-svn-review") && cache.svnReview && !busy) {
        if (!window.confirm("确认取消 Codex 审查并改为人工审核吗？审核快照会保留。")) return;
        void callTool(TOOLS.svnCancelReview, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id, message: "用户已取消 Codex 审查，改为人工审核。" });
      }
      if (event.target.closest("#confirm-svn-review") && cache.svnReview && !busy) {
        if ($("svn-reviewed")?.checked !== true) return showError(new Error("请先人工查看全部选定文件和风险。"));
        if (cache.svnReview.verdict === "warning" && $("svn-risk")?.checked !== true) return showError(new Error("当前审核有警告，请确认理解风险。"));
        if (cache.svnReview.crossTaskConflicts?.length && $("svn-overlap")?.checked !== true) return showError(new Error("请先确认已核对多个任务混入同一文件的风险。"));
        void callTool(TOOLS.svnConfirmReview, {
          issueKey: cache.svnContext.issueKey,
          reviewId: cache.svnReview.id,
          reviewed: true,
          riskAcknowledged: $("svn-risk")?.checked === true,
          overlapAcknowledged: $("svn-overlap")?.checked === true
        });
      }
      if (event.target.closest("#commit-svn") && cache.svnReview && cache.svnConfirmation && !busy) {
        const message = `这将真实提交 ${cache.svnReview.selectedPaths?.length || 0} 个显式 SVN 路径。\n\n提交信息：\n${cache.svnReview.message || ""}\n\n确认继续吗？`;
        if (!window.confirm(message)) return;
        void (async () => {
          const result = await callTool(TOOLS.svnCommit, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id, confirmationToken: cache.svnConfirmation.confirmationToken });
          if (!result) await callTool(TOOLS.svnGetReview, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id });
        })();
      }
      if (event.target.closest("#reconcile-svn") && cache.svnReview && !busy) {
        void callTool(TOOLS.svnReconcile, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id });
      }
      if (event.target.closest("#confirm-svn-committed") && cache.svnReview && !busy) {
        const revision = $("svn-manual-revision")?.value?.trim() || "";
        if (!/^r?\d+$/i.test(revision)) return showError(new Error("请输入有效的 SVN revision。"));
        if (!window.confirm(`仅当你已经人工查看 SVN 日志并确认 ${revision} 提交成功时继续。不会再次提交。`)) return;
        void callTool(TOOLS.svnConfirmCommitted, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id, acknowledged: true, revision });
      }
      if (event.target.closest("#abandon-svn-review") && cache.svnReview && !busy) {
        if (!window.confirm("确认放弃当前审核草稿并重新扫描最新 SVN 文件状态吗？不会还原任何文件。")) return;
        void (async () => {
          const abandoned = await callTool(TOOLS.svnAbandon, { issueKey: cache.svnContext.issueKey, reviewId: cache.svnReview.id, acknowledged: true, message: "用户已确认放弃旧审核草稿并重新扫描。" });
          if (abandoned) await callTool(TOOLS.svnInspect, svnScopedArguments());
        })();
      }
      if (event.target.closest("#execute-transition") && cache.issue?.issue && cache.transitions && !busy) {
        const transitionId = HOST_KIND === "dsh" ? transitionSelectedId : $("transition-select")?.value || "";
        const transition = cache.transitions.transitions.find((item) => item.id === transitionId);
        if (!transition) return showError(new Error("请先选择目标状态。"));
        if (!window.confirm(`确认将 ${cache.issue.issue.key} 从“${cache.issue.issue.statusName}”流转到“${transition.to.name}”吗？`)) return;
        void (async () => {
          const prepared = await callTool(TOOLS.prepareTransition, { issueKey: cache.issue.issue.key, transitionId: transition.id, expectedTargetStatus: transition.to.name });
          if (prepared?.confirmationId) await callTool(TOOLS.executeTransition, { confirmationId: prepared.confirmationId });
        })();
      }
    });
    document.addEventListener("dblclick", (event) => {
      svnFileInteraction.doubleClick(event);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && attachmentLightboxOpen) {
        event.preventDefault();
        attachmentLightboxOpen = false;
        renderDetail({ patchSelectors: ["#attachment-preview-slot"] });
        window.requestAnimationFrame(() => document.querySelector("[data-open-attachment-lightbox]")?.focus());
        return;
      }
      if (event.key === "Escape" && (associationOpen || transitionPanelOpen) && !busy) {
        event.preventDefault();
        if (associationOpen) captureAssociationDraft();
        const returnTarget = associationOpen ? "manage-association" : "open-transition-panel";
        associationOpen = false;
        transitionPanelOpen = false;
        renderDetail({ modalOnly: true });
        $(returnTarget)?.focus();
        return;
      }
      if ((event.key === "Enter" || event.key === " ") && event.target.matches("article[data-key], .sheet-row[data-key]")) {
        event.preventDefault();
        void openIssue(event.target.dataset.key);
      }
    });
    document.addEventListener("input", (event) => {
      if (event.target.matches("input[data-sheet-filter]") && cache.sheet && !busy) {
        sheetFilters[event.target.dataset.sheetFilter] = event.target.value;
        renderSheetIssues();
        return;
      }
      if (event.target.id === "svn-summary") {
        svnDraftSummary = event.target.value;
        syncSvnCommitMessagePreview();
      }
      if (event.target.id === "association-supplement") associationSupplement = event.target.value;
      if (event.target.id === "association-thread-search" && associationOpen) {
        associationThreadSearch = event.target.value;
        const list = $("association-thread-list");
        if (list) {
          list.innerHTML = associationThreadListHtml(cache.threads?.threads || [], cache.issue?.issue?.key || "");
          syncAssociationThreadPicker();
        }
      }
    });
    document.addEventListener("change", (event) => {
      if (event.target.matches("select[data-sheet-filter]") && cache.sheet && !busy) {
        sheetFilters[event.target.dataset.sheetFilter] = event.target.value;
        renderSheetIssues();
        return;
      }
      const associationWorkspace = event.target.closest("input[data-association-workspace]");
      if (associationWorkspace && associationOpen && !busy) {
        captureAssociationDraft();
        const identity = associationWorkspace.dataset.associationWorkspace;
        if (associationWorkspace.checked) associationSelectedWorkspaceIds.add(identity);
        else associationSelectedWorkspaceIds.delete(identity);
        if (!associationDefaultWorkspaceId || !associationSelectedWorkspaceIds.has(associationDefaultWorkspaceId)) {
          associationDefaultWorkspaceId = Array.from(associationSelectedWorkspaceIds)[0] || "";
        }
        syncAssociationWorkspacePicker();
        return;
      }
      if (event.target.name === "association-default-workspace" && associationOpen && !busy) {
        captureAssociationDraft();
        associationDefaultWorkspaceId = event.target.value;
        syncAssociationWorkspacePicker();
        return;
      }
      if (event.target.name === "association-conversation-mode" && associationOpen && !busy) {
        captureAssociationDraft();
        associationConversationMode = event.target.value;
        renderDetail({ modalOnly: true, animateModal: false });
        if (associationConversationMode === "existing" && !cache.threads) void callTool(TOOLS.threads, { limit: 100 }, { background: true });
        return;
      }
      if (event.target.id === "svn-project-scope" && cache.svnContext && !cache.svnReview && !busy) {
        svnFileInteraction.cancel();
        cache.svnPreview = null;
        cache.svnConfirmation = null;
        svnSelectedPaths = new Set();
        svnActivePreviewPath = "";
        svnPreviewRequestPath = "";
        void callTool(TOOLS.svnInspect, {
          issueKey: cache.svnContext.issueKey,
          projectScopeId: event.target.value
        });
        return;
      }
      if (event.target.name === "svn-review-mode") {
        svnDraftCodexReview = cache.svnContext?.capabilities?.codexReview === true
          && event.target.value === "codex";
        document.querySelectorAll(".svn-review-mode").forEach((label) => label.classList.toggle("active", label.contains(event.target)));
      }
    });
    $("sheet-search").addEventListener("input", renderSheetIssues);
    $("refresh").addEventListener("click", () => { if (activeTab === "sheets") return callTool(selectedSheet ? TOOLS.sheet : TOOLS.sheets, selectedSheet ? { projectId: selectedSheet.projectId, sheetId: selectedSheet.id, limit: 100 } : {}); return callTool(TOOLS.board, { includeCompleted: true, limitPerType: 100 }); });

    window.addEventListener("message", (event) => {
      if (event.source !== window.parent) return;
      const message = event.data;
      if (event.origin === window.location.origin && message?.source === "jira-workbench-dsh-host" && message.type === "navigate-back") {
        void returnToTaskList();
        return;
      }
      if (!message || message.jsonrpc !== "2.0") return;
      if (message.id !== undefined && pending.has(message.id)) { const entry = pending.get(message.id); pending.delete(message.id); message.error ? entry.reject(message.error) : entry.resolve(message.result); return; }
      if (message.method === "ui/notifications/tool-result") acceptResult(message.params?.structuredContent);
    }, { passive: true });

    async function initialize() {
      let stored = window.openai?.widgetState?.privateContent || window.openai?.widgetState || {};
      if (LOCAL_TRANSPORT) {
        if (DESKTOP_BRIDGE_TRANSPORT) stored = window.__JIRA_WORKBENCH_INITIAL_WIDGET_STATE__ || {};
        else {
          try { stored = JSON.parse(window.localStorage.getItem(LOCAL_STATE_KEY) || "{}"); } catch { stored = {}; }
        }
        const requestedIssueKey = String(LAUNCH_PARAMS.get("issue") || "").trim().toUpperCase();
        if (/^[A-Z][A-Z0-9_]*-\d+$/.test(requestedIssueKey)) {
          stored = {
            ...stored,
            openIssueKey: requestedIssueKey,
            openSvn: LAUNCH_PARAMS.get("svn") === "1"
          };
        }
        $("local-close").hidden = false;
      }
      if (EMBED_DETAIL_MODE) document.body.classList.add("detail-embed");
      if (WORKSPACE_EMBED_MODE) document.body.classList.add("workspace-embed");
      if (stored.openSvn) {
        svnDedicatedMode = true;
        enterSvnLayout();
      }
      activeTab = ["active", "sheets", "history"].includes(stored.activeTab) ? stored.activeTab : "active";
      selectedSheet = stored.selectedSheet && typeof stored.selectedSheet === "object"
        ? { projectId: String(stored.selectedSheet.projectId || ""), id: String(stored.selectedSheet.id || "") }
        : null;
      statusFilters = stored.statusFilters && typeof stored.statusFilters === "object" && !Array.isArray(stored.statusFilters)
        ? Object.fromEntries(Object.entries(stored.statusFilters).map(([key, values]) => [key, Array.isArray(values) ? values.map(String) : []]))
        : {};
      try {
        if (LOCAL_TRANSPORT) {
          await loadCapabilities();
          if (stored.openIssueKey) {
            await openIssue(String(stored.openIssueKey));
            const hasSvnWorkspace = (cache.workspaces?.binding?.workspace?.projectScopes || []).length > 0
              || (cache.issue?.issue?.binding?.projectScopes || []).length > 0;
            if (stored.openSvn && hasSvnWorkspace) {
              await callTool(TOOLS.svnInspect, { issueKey: String(stored.openIssueKey) });
            }
          } else await selectTab(activeTab);
          if (!stored.openSvn) {
            // automation 与 update 是宿主可选能力（DSH 侧不提供）：工具未注册
            // 时静默隐藏对应 UI，不打断核心看板。
            if (await callTool(TOOLS.automationStatus, {}, { silent: true }) === null) $("monitor").hidden = true;
            void callTool(TOOLS.updateStatus, {}, { background: true });
          }
        } else {
          await request("ui/initialize", { protocolVersion: "2025-11-21", appInfo: { name: "jira-workbench", title: "Jira 任务工作台", version: APP_VERSION }, appCapabilities: {} });
          notify("ui/notifications/initialized", {});
          await loadCapabilities();
          void callTool(TOOLS.automationStatus);
          void callTool(TOOLS.updateStatus, {}, { background: true });
        }
      } catch (error) {
        if (window.openai?.toolOutput) acceptResult(window.openai.toolOutput);
        else showError(error);
      }
      // 宿主未提供设置入口（SETTINGS_URL 被替换为空）时保持隐藏；否则显示。
      if (EFFECTIVE_SETTINGS_URL || HOST_KIND === "dsh" && WORKSPACE_EMBED_MODE) $("settings").hidden = false;
      document.querySelectorAll("nav button").forEach((button) => button.classList.toggle("active", button.dataset.tab === activeTab));
    }
    void initialize();
  </script>
</body>
</html>
