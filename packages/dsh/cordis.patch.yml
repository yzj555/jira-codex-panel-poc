# jira-workbench-dsh bundle patch: 进程内 host 插件。
#
# 本 patch 叠加在 dsh-base 之上，挂载 jira-workbench-dsh 自带的 plugin.mjs，
# 把宿主无关的 core 工具面（@jira-workbench/core 的 buildToolDefinitions）
# 直接注册到 DSH 的 ctx.tools。模型侧工具名就是 core 的原始工具名
# （jira_list_my_tasks 等），不再有 mcp__jira-workbench__ 前缀。
#
# 覆盖 8 个 Jira 只读/流转工具与 11 个 SVN 审核工具（无 Codex 会话、桌面操作、
# 自动 Bug 分析或 GitHub 更新）。SVN 审查降级为人工审核（无 DSH agent-loop
# 审查 provider）。
#
# 使用前提：@jira-workbench/core 与 jira-workbench-dsh 包须安装在 DSH 能解析
# 的位置（$DSH_HOME/profiles/<name>/node_modules，或通过 bareModuleBaseUrl
# 锚定）。plugin.mjs 是纯 JS（ESM），不依赖 DSH 的 TypeScript 编译产物。

- insert:
    - id: jira-workbench
      name: 'jira-workbench-dsh'
